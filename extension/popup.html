<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube feedback</title><link rel="stylesheet" href="popup.css"><script defer src="src/popup.js"></script></head>
<body><main>
  <h1>Not Interested videos</h1>
  <div class="toolbar"><button id="refresh" type="button">Refresh</button><button id="google" type="button">Open Google history</button><button id="settings" type="button">Shortcut settings</button></div>
  <p id="status" role="status" aria-live="polite">Loading feedback...</p>
  <section id="confirmation" aria-label="Confirm feedback removal" hidden><p id="confirm-text"></p><button id="confirm-remove" type="button">Remove feedback</button><button id="cancel" type="button">Cancel</button></section>
  <ul id="entries" aria-label="Loaded video feedback"></ul>
  <nav aria-label="Feedback pages"><button id="previous" type="button" disabled>Previous</button><span id="page"></span><button id="next" type="button" disabled>Next</button></nav>
  <button id="older" type="button" disabled>Load older feedback</button>
  <p class="note">Only loaded video feedback is shown. Channel feedback is kept. Remove all is unavailable because Google's bulk controls can also remove channel feedback.</p>
</main></body></html>
