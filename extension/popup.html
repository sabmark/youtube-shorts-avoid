<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Shorts Avoid</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="popup.css">
  <script defer src="src/popup.js"></script>
</head>
<body>
  <main class="popup-shell">
    <header class="d-flex align-items-center gap-3">
      <img src="icons/icon48.png" width="40" height="40" alt="">
      <h1 class="h5 mb-0">YouTube Shorts Avoid</h1>
    </header>
    <nav class="d-grid gap-2" aria-label="Extension menu">
      <button id="settings" class="btn btn-primary" type="button">Shortcut settings</button>
      <a class="btn btn-outline-secondary" href="https://myactivity.google.com/page?hl=en&amp;page=youtube_user_feedback" target="_blank" rel="noopener noreferrer">Not Interested history</a>
      <a class="btn btn-outline-secondary" href="https://myactivity.google.com/page?hl=en&amp;page=youtube_likes" target="_blank" rel="noopener noreferrer">Liked videos history</a>
    </nav>
    <p class="note text-body-secondary mb-0">Manage your feedback on Google. History links open in a new tab.</p>
    <p id="status" class="note text-body-secondary mb-0" role="status" aria-live="polite" hidden></p>
  </main>
</body>
</html>
