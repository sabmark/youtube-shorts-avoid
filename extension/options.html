<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Shorts Avoid settings</title>
  <link rel="stylesheet" href="options.css">
  <script defer src="src/shortcut.js"></script>
  <script defer src="src/options.js"></script>
</head>
<body>
  <main>
    <h1>Avoid shortcut</h1>
    <p>Choose a shortcut to dismiss the current video and channel, then move to the next Short.</p>
    <label for="shortcut">Shortcut key</label>
    <input id="shortcut" type="text" readonly aria-describedby="hint" disabled>
    <p id="hint">Focus the field and press a key, optionally with Ctrl, Alt, Shift or Meta. Tab moves focus; Escape cancels a change. Browser shortcuts may take priority.</p>
    <div class="actions">
      <button id="save" type="button" disabled>Save shortcut</button>
      <button id="reset" type="button" disabled>Reset to Right Arrow</button>
    </div>
    <button id="retry" type="button" hidden>Retry loading settings</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
